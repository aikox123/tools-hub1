<style>

    #card-fields-section {

    button.main-button {
        width: 100%;

        padding: 14px;

    #pay-button {

<div class="container">

</div>

<script>

    // ============================================================
    // CONFIG
    // ============================================================

    const API_URL =
        "https://tools-hub-backend.onrender.com";

    /*
        Client ID is safe to use in frontend.

        DO NOT PUT YOUR PAYPAL CLIENT SECRET HERE.
    */

    const PAYPAL_CLIENT_ID =
        "BAAHSfnFMKkh0vJ9fXNFejON388u3JiuhK31Th6li_0ikrm5-Xgs7TYClO9UNO5HEbzNFxHu3Q4gLMg3yM";


    // ============================================================
    // STATE
    // ============================================================

    let selectedAmount = null;

    let paypalSdk = null;

    let cardSession = null;

    let cardFieldsReady = false;


    // ============================================================
    // ELEMENTS
    // ============================================================

    const balanceElement =
        document.getElementById("balance");

    const messageElement =
        document.getElementById("message");

    const paypalButton =
        document.getElementById("paypal-button");

    const cardButton =
        document.getElementById("pay-button");

    const cardFieldsSection =
        document.getElementById("card-fields-section");


    // ============================================================
    // MESSAGE
    // ============================================================

    function showMessage(text, type = "loading") {

        messageElement.textContent = text;

        messageElement.className =
            "message " + type;
    }


    function hideMessage() {

        messageElement.textContent = "";

        messageElement.className =
            "message";
    }


    // ============================================================
    // AMOUNT SELECTION
    // ============================================================

    document
        .querySelectorAll(".amount-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".amount-btn")
                    .forEach(btn =>
                        btn.classList.remove("selected")
                    );

                button.classList.add("selected");

                selectedAmount =
                    Number(button.dataset.amount);

                paypalButton.disabled = false;

                if (cardFieldsReady) {
                    cardButton.disabled = false;
                }
            });

        });


    // ============================================================
    // LOAD BALANCE
    // ============================================================

    async function loadBalance() {

        try {

            const response =
                await fetch(
                    `${API_URL}/api/balance`,
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );

            const data =
                await response.json();

            if (data.success) {

                balanceElement.textContent =
                    `$${Number(data.balance).toFixed(2)}`;

            }

        } catch (error) {

            console.error(
                "Balance error:",
                error
            );

        }
    }


    // ============================================================
    // CREATE ORDER
    // ============================================================

    async function createOrder() {

        if (!selectedAmount) {

            throw new Error(
                "Please select an amount."
            );
        }

        const response =
            await fetch(
                `${API_URL}/api/create-topup`,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        amount: selectedAmount
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Could not create PayPal order."
            );
        }

        return data;
    }


    // ============================================================
    // CAPTURE ORDER
    // ============================================================

    async function captureOrder(orderId) {

        const response =
            await fetch(
                `${API_URL}/api/capture`,
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        orderId: orderId
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                data.message ||
                "Payment capture failed."
            );
        }

        return data;
    }


    // ============================================================
    // PAYPAL REDIRECT PAYMENT
    // ============================================================

    paypalButton.addEventListener(
        "click",
        async () => {

            if (!selectedAmount) {

                showMessage(
                    "Please select an amount first.",
                    "error"
                );

                return;
            }

            try {

                paypalButton.disabled = true;

                cardButton.disabled = true;

                showMessage(
                    "Creating PayPal payment...",
                    "loading"
                );

                const order =
                    await createOrder();

                /*
                    Backend returns PayPal approval URL.
                    Buyer is redirected to PayPal.
                */

                window.location.href =
                    order.approvalUrl;

            } catch (error) {

                console.error(
                    "PayPal error:",
                    error
                );

                showMessage(
                    error.message ||
                    "PayPal payment failed.",
                    "error"
                );

                paypalButton.disabled = false;

                if (selectedAmount) {
                    cardButton.disabled =
                        !cardFieldsReady;
                }
            }

        }
    );


    // ============================================================
    // INITIALIZE PAYPAL V6
    // ============================================================

    async function initializePayPal() {

        try {

            if (
                !window.paypal ||
                !window.paypal.createInstance
            ) {

                throw new Error(
                    "PayPal SDK did not load."
                );
            }

            /*
                Initialize PayPal v6.

                Client ID is public/browser-safe.
            */

            paypalSdk =
                await window.paypal.createInstance({

                    clientId:
                        PAYPAL_CLIENT_ID,

                    components: [
                        "paypal-payments",
                        "card-fields"
                    ],

                    pageType:
                        "checkout",

                    locale:
                        "en-US"
                });


            console.log(
                "PayPal SDK initialized."
            );


            // ====================================================
            // CHECK ELIGIBILITY
            // ====================================================

            let paymentMethods;

            try {

                paymentMethods =
                    await paypalSdk.findEligibleMethods({

                        currencyCode: "USD"

                    });

            } catch (eligibilityError) {

                console.error(
                    "Eligibility check failed:",
                    eligibilityError
                );

                /*
                    PayPal redirect still works through
                    the backend, so we don't disable it.
                */

                return;

            }


            // ====================================================
            // CARD FIELDS
            // ====================================================

            let cardEligible = false;

            try {

                /*
                    Card Fields eligibility.
                    Some PayPal v6 environments expose
                    advanced_cards eligibility.
                */

                if (
                    typeof paymentMethods.isEligible ===
                    "function"
                ) {

                    cardEligible =
                        paymentMethods.isEligible(
                            "advanced_cards"
                        );

                }

            } catch (error) {

                console.error(
                    "Card eligibility error:",
                    error
                );

            }


            if (!cardEligible) {

                console.log(
                    "Card Fields are not eligible for this PayPal account."
                );

                cardFieldsSection.style.display =
                    "none";

                return;
            }


            // ====================================================
            // CREATE CARD SESSION
            // ====================================================

            cardSession =
                paypalSdk
                    .createCardFieldsOneTimePaymentSession();


            // ====================================================
            // CARD NUMBER
            // ====================================================

            const numberField =
                cardSession.createCardFieldsComponent({

                    type: "number",

                    placeholder:
                        "Card number",

                    style: {
                        input: {
                            fontSize: "16px"
                        }
                    }

                });


            // ====================================================
            // EXPIRY
            // ====================================================

            const expiryField =
                cardSession.createCardFieldsComponent({

                    type: "expiry",

                    placeholder:
                        "MM/YY"

                });


            // ====================================================
            // CVV
            // ====================================================

            const cvvField =
                cardSession.createCardFieldsComponent({

                    type: "cvv",

                    placeholder:
                        "CVV"

                });


            // ====================================================
            // MOUNT
            // ====================================================

            document
                .getElementById("card-number")
                .appendChild(numberField);

            document
                .getElementById("card-expiry")
                .appendChild(expiryField);

            document
                .getElementById("card-cvv")
                .appendChild(cvvField);


            cardFieldsSection.style.display =
                "block";


            cardFieldsReady = true;

            cardButton.disabled =
                !selectedAmount;


            console.log(
                "Card Fields initialized."
            );


        } catch (error) {

            console.error(
                "PayPal SDK initialization failed:",
                error
            );

            cardFieldsSection.style.display =
                "none";
        }
    }


    // ============================================================
    // CARD PAYMENT
    // ============================================================

    cardButton.addEventListener(
        "click",
        async () => {

            if (!selectedAmount) {

                showMessage(
                    "Please select an amount first.",
                    "error"
                );

                return;
            }

            if (!cardSession) {

                showMessage(
                    "Card payment is not available.",
                    "error"
                );

                return;
            }

            try {

                cardButton.disabled = true;

                paypalButton.disabled = true;

                showMessage(
                    "Creating payment...",
                    "loading"
                );


                // ================================================
                // CREATE PAYPAL ORDER
                // ================================================

                const order =
                    await createOrder();


                // ================================================
                // SUBMIT CARD
                // ================================================

                showMessage(
                    "Processing card payment...",
                    "loading"
                );


                const result =
                    await cardSession.submit(
                        order.orderId,
                        {
                            billingAddress: {
                                postalCode:
                                    ""
                            }
                        }
                    );


                console.log(
                    "Card result:",
                    result
                );


                // ================================================
                // SUCCESS
                // ================================================

                if (
                    result.state ===
                    "succeeded"
                ) {

                    showMessage(
                        "Payment approved. Updating balance...",
                        "loading"
                    );


                    const captured =
                        await captureOrder(
                            result.data.orderId ||
                            order.orderId
                        );


                    await loadBalance();


                    showMessage(
                        `Payment successful! $${Number(captured.credited).toFixed(2)} added to your balance.`,
                        "success"
                    );


                    paypalButton.disabled =
                        false;


                    cardButton.disabled =
                        false;


                    return;
                }


                // ================================================
                // CANCELLED
                // ================================================

                if (
                    result.state ===
                    "canceled"
                ) {

                    showMessage(
                        "Payment authentication was cancelled. Please try again.",
                        "error"
                    );

                    paypalButton.disabled =
                        false;

                    cardButton.disabled =
                        false;

                    return;
                }


                // ================================================
                // FAILED
                // ================================================

                if (
                    result.state ===
                    "failed"
                ) {

                    showMessage(
                        result.data?.message ||
                        "Payment failed. Please check your card details.",
                        "error"
                    );

                    paypalButton.disabled =
                        false;

                    cardButton.disabled =
                        false;

                    return;
                }


                showMessage(
                    "Payment could not be completed.",
                    "error"
                );


                paypalButton.disabled =
                    false;

                cardButton.disabled =
                    false;


            } catch (error) {

                console.error(
                    "Card payment error:",
                    error
                );

                showMessage(
                    error.message ||
                    "An unexpected payment error occurred.",
                    "error"
                );

                paypalButton.disabled =
                    false;

                cardButton.disabled =
                    false;
            }

        }
    );


    // ============================================================
    // HANDLE PAYPAL RETURN
    // ============================================================

    async function handlePayPalReturn() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const paypalReturn =
            params.get(
                "paypal_return"
            );

        const orderId =
            params.get(
                "token"
            );


        if (
            paypalReturn !== "1" ||
            !orderId
        ) {

            return;
        }


        try {

            paypalButton.disabled =
                true;

            cardButton.disabled =
                true;

            showMessage(
                "Completing PayPal payment...",
                "loading"
            );


            const result =
                await captureOrder(
                    orderId
                );


            await loadBalance();


            showMessage(
                `Payment successful! $${Number(result.credited).toFixed(2)} added to your balance.`,
                "success"
            );


            /*
                Remove PayPal query parameters
                from the browser URL.
            */

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );


            paypalButton.disabled =
                false;

            cardButton.disabled =
                !cardFieldsReady;


        } catch (error) {

            console.error(
                "PayPal return error:",
                error
            );

            showMessage(
                error.message ||
                "Could not complete PayPal payment.",
                "error"
            );


            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );


            paypalButton.disabled =
                false;

            cardButton.disabled =
                !cardFieldsReady;
        }

    }


    // ============================================================
    // START
    // ============================================================

    document.addEventListener(
        "DOMContentLoaded",
        async () => {

            await loadBalance();

            await initializePayPal();

            await handlePayPalReturn();

        }
    );

</script>
